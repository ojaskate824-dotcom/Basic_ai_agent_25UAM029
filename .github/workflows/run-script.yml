name: Execute Python Script Directly on GitHub

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  run-search-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Initialize Cloud Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run BFS DFS Profiling
        run: python SLA2_25UAM029/BFS_DFS_Profiling/profile_search.py
